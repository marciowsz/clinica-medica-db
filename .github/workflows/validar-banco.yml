name: Validar banco

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Criar o banco clinica_medica
        run: psql -v ON_ERROR_STOP=1 -d postgres -f database/00_create_database.sql

      - name: Criar tabelas e dados (init.sql)
        run: psql -v ON_ERROR_STOP=1 -d clinica_medica -f database/init.sql

      - name: Testar regras de negocio (tests.sql)
        run: psql -v ON_ERROR_STOP=1 -d clinica_medica -f database/tests.sql
